<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companies | CRM Pro</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page="companies">
<div class="app-shell">
  <div id="sidebar"></div>
  <div class="main">
    <div id="navbar"></div>
    <main class="content">
      <div class="page-header">
        <div>
          <h1 class="ph-title">Companies</h1>
          <div class="ph-sub">Manage your clients, prospects and accounts</div>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="btnNewCompany" type="button">&#65291; New company</button>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="search-box">
            <span class="s-ico">&#128269;</span>
            <input class="input" type="text" id="companySearch" placeholder="Search name, email, industry…">
          </div>
          <select class="select" id="filterCompanyStatus" aria-label="Status filter">
            <option value="">All statuses</option>
            <option value="Active">Active</option>
            <option value="Prospect">Prospect</option>
            <option value="Churned">Churned</option>
          </select>
          <div class="spacer"></div>
          <button class="btn btn-ghost" id="btnCompanyClear" type="button">Clear</button>
        </div>
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Company</th>
                  <th>Industry</th>
                  <th>Contact</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Leads</th>
                  <th class="td-right">Actions</th>
                </tr>
              </thead>
              <tbody id="companyRows"></tbody>
            </table>
          </div>
        </div>
        <div id="pagination"></div>
      </div>
    </main>
    <div id="footer"></div>
  </div>
</div>

<div class="modal-overlay" id="companyModal">
  <div class="modal" role="dialog" aria-modal="true">
    <form id="companyForm">
      <div class="modal-header">
        <h3 id="companyModalTitle">New company</h3>
        <button class="modal-close" data-close="companyModal" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group span-2">
            <label for="companyName">Name <span class="req">*</span></label>
            <input class="input" type="text" id="companyName" placeholder="Company name" required>
          </div>
          <div class="form-group">
            <label for="companyIndustry">Industry</label>
            <input class="input" type="text" id="companyIndustry" placeholder="e.g. Retail">
          </div>
          <div class="form-group">
            <label for="companyWebsite">Website</label>
            <input class="input" type="text" id="companyWebsite" placeholder="https://example.com">
          </div>
          <div class="form-group">
            <label for="companyEmail">Email</label>
            <input class="input" type="email" id="companyEmail" placeholder="hello@company.com">
          </div>
          <div class="form-group">
            <label for="companyPhone">Phone</label>
            <input class="input" type="text" id="companyPhone" placeholder="+1 555 000 1234">
          </div>
          <div class="form-group">
            <label for="companyStatus">Status</label>
            <select class="select" id="companyStatus">
              <option value="Active">Active</option>
              <option value="Prospect" selected>Prospect</option>
              <option value="Churned">Churned</option>
            </select>
          </div>
          <div class="form-group">
            <label for="companyCity">City</label>
            <input class="input" type="text" id="companyCity" placeholder="e.g. Austin">
          </div>
          <div class="form-group span-2">
            <label for="companyAddress">Address</label>
            <input class="input" type="text" id="companyAddress" placeholder="Street address">
          </div>
          <div class="form-group">
            <label for="companyCountry">Country</label>
            <input class="input" type="text" id="companyCountry" placeholder="e.g. USA">
          </div>
          <div class="form-group span-2">
            <label for="companyNotes">Notes</label>
            <textarea class="textarea" id="companyNotes" placeholder="Anything the team should know"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" type="button" data-close="companyModal">Cancel</button>
        <button class="btn btn-primary" type="submit" id="companySaveBtn">Save company</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="companyDetailModal">
  <div class="modal lg" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="companyDetailTitle">Company details</h3>
      <button class="modal-close" data-close="companyDetailModal" type="button">&times;</button>
    </div>
    <div class="modal-body" id="companyDetailInfo"></div>
    <div class="card-header">
      <h3>Linked leads</h3>
      <span class="ch-sub" id="companyDetailLeadCount"></span>
    </div>
    <div class="card-body" id="companyDetailLeads"></div>
    <div class="modal-footer">
      <button class="btn" type="button" data-close="companyDetailModal">Close</button>
      <button class="btn btn-primary" type="button" id="btnCompanyDetailEdit">Edit company</button>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-container"></div>
<script src="/js/auth.js"></script>
<script src="/js/leads.js"></script>
</body>
</html>
