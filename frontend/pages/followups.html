<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow-ups | CRM Pro</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page="followups">
<div class="app-shell">
  <div id="sidebar"></div>
  <div class="main">
    <div id="navbar"></div>
    <main class="content">
      <div class="page-header">
        <div>
          <h1 class="ph-title">Follow-ups</h1>
          <div class="ph-sub">Stay on top of every scheduled touchpoint</div>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="btnNewFollowup" type="button">&#65291; Quick follow-up</button>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="search-box">
            <span class="s-ico">&#128269;</span>
            <input class="input" type="text" id="followupSearch" placeholder="Search lead or notes…">
          </div>
          <select class="select" id="filterStatus" aria-label="Status filter">
            <option value="">All statuses</option>
            <option value="Pending">Pending</option>
            <option value="Done">Done</option>
            <option value="Skipped">Skipped</option>
            <option value="Rescheduled">Rescheduled</option>
          </select>
          <label class="check-row"><input type="checkbox" id="filterDue"> Due only</label>
          <div class="spacer"></div>
          <span class="muted small" id="followupCount"></span>
          <button class="btn btn-ghost" id="btnFollowupClear" type="button">Clear</button>
        </div>
        <div class="card-body tight">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Lead</th>
                  <th>Type</th>
                  <th>Notes</th>
                  <th>Due date</th>
                  <th>Status</th>
                  <th>Created by / at</th>
                  <th class="td-right">Actions</th>
                </tr>
              </thead>
              <tbody id="followupRows"></tbody>
            </table>
          </div>
        </div>
        <div id="pagination"></div>
      </div>

      <section class="card" id="sendMessageCard" style="display:none">
        <div class="card-header">
          <div>
            <h3>Send message</h3>
            <div class="ch-sub">Send a notification straight to an employee</div>
          </div>
        </div>
        <div class="card-body">
          <form id="sendMessageForm" class="form-grid">
            <div class="form-group">
              <label for="msgEmployee">Employee <span class="req">*</span></label>
              <select class="select" id="msgEmployee"><option value="">Select employee</option></select>
            </div>
            <div class="form-group">
              <label for="msgTitle">Title</label>
              <input class="input" type="text" id="msgTitle" placeholder="e.g. Follow-up reminder">
            </div>
            <div class="form-group span-2">
              <label for="msgBody">Message <span class="req">*</span></label>
              <textarea class="textarea" id="msgBody" placeholder="Write your message…"></textarea>
            </div>
            <div class="span-2">
              <button class="btn btn-primary" type="submit" id="msgSendBtn">Send message</button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <div id="footer"></div>
  </div>
</div>

<div class="modal-overlay" id="followupModal">
  <div class="modal" role="dialog" aria-modal="true">
    <form id="followupForm">
      <div class="modal-header">
        <h3 id="followupModalTitle">Quick follow-up</h3>
        <button class="modal-close" data-close="followupModal" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group span-2">
            <label for="fuLead">Lead <span class="req">*</span></label>
            <select class="select" id="fuLead"><option value="">Select lead</option></select>
          </div>
          <div class="form-group">
            <label for="fuType">Type</label>
            <select class="select" id="fuType">
              <option value="Call">Call</option>
              <option value="Email">Email</option>
              <option value="Meeting">Meeting</option>
              <option value="WhatsApp">WhatsApp</option>
              <option value="Demo">Demo</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fuStatus">Status</label>
            <select class="select" id="fuStatus">
              <option value="Pending" selected>Pending</option>
              <option value="Done">Done</option>
              <option value="Skipped">Skipped</option>
              <option value="Rescheduled">Rescheduled</option>
            </select>
          </div>
          <div class="form-group span-2">
            <label for="fuDue">Due date</label>
            <input class="input" type="date" id="fuDue">
          </div>
          <div class="form-group span-2">
            <label for="fuNotes">Notes</label>
            <textarea class="textarea" id="fuNotes" placeholder="What needs to happen?"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" type="button" data-close="followupModal">Cancel</button>
        <button class="btn btn-primary" type="submit" id="followupSaveBtn">Save follow-up</button>
      </div>
    </form>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-container"></div>
<script src="/js/auth.js"></script>
<script src="/js/leads.js"></script>
</body>
</html>
